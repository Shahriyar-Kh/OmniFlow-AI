name: ${COMPOSE_PROJECT_NAME:-tbos_automation}

services:
  postgres:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      APP_DB_NAME: ${APP_DB_NAME:?Set APP_DB_NAME in .env}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      N8N_DB_NAME: ${N8N_DB_NAME:?Set N8N_DB_NAME in .env}
      N8N_DB_USER: ${N8N_DB_USER:?Set N8N_DB_USER in .env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      TZ: ${APP_TIMEZONE:-Asia/Karachi}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - tbos_private

  n8n:
    image: n8nio/n8n:2.39.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:?Set N8N_DB_NAME in .env}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:?Set N8N_DB_USER in .env}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_USER_FOLDER: ${N8N_USER_FOLDER:-/home/node/.n8n}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: ${APP_TIMEZONE:-Asia/Karachi}
      TZ: ${APP_TIMEZONE:-Asia/Karachi}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:${N8N_USER_FOLDER:-/home/node/.n8n}
      - ./n8n/workflows:/workflows:ro
      - ./storage:/files
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - tbos_private
      - tbos_edge

  renderer-api:
    build:
      context: .
      dockerfile: apps/renderer/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: 8080
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Karachi}
      APP_OPENAPI_ENABLED: ${APP_OPENAPI_ENABLED:-true}
      APP_VERSION: ${APP_VERSION:-0.2.0}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      N8N_INTERNAL_URL: ${N8N_INTERNAL_URL:-http://n8n:5678}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      OLLAMA_FALLBACK_MODEL: ${OLLAMA_FALLBACK_MODEL:-}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_MAX_RETRIES: ${OLLAMA_MAX_RETRIES:-2}
      OLLAMA_MAX_CONCURRENCY: ${OLLAMA_MAX_CONCURRENCY:-1}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.2}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-2.5-pro}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-60}
      AI_PRIMARY_PROVIDER: ${AI_PRIMARY_PROVIDER:-gemini}
      SHARED_STORAGE_PATH: ${SHARED_STORAGE_PATH:-/workspace/storage}
      TOPIC_LIBRARY_PATH: ${TOPIC_LIBRARY_PATH:-/workspace/config/topics.yaml}
      PROMPT_TEMPLATES_PATH: ${PROMPT_TEMPLATES_PATH:-/workspace/config/prompts}
      MODEL_PROFILES_PATH: ${MODEL_PROFILES_PATH:-/workspace/config/model_profiles.yaml}
      QA_PASS_THRESHOLD: ${QA_PASS_THRESHOLD:-85}
      FACEBOOK_HASHTAG_LIMIT: ${FACEBOOK_HASHTAG_LIMIT:-15}
      INSTAGRAM_HASHTAG_LIMIT: ${INSTAGRAM_HASHTAG_LIMIT:-5}
      TIKTOK_HASHTAG_LIMIT: ${TIKTOK_HASHTAG_LIMIT:-5}
      FEATURE_TELEGRAM_ENABLED: ${FEATURE_TELEGRAM_ENABLED:-false}
      FEATURE_META_ENABLED: ${FEATURE_META_ENABLED:-false}
      FEATURE_R2_ENABLED: ${FEATURE_R2_ENABLED:-false}
      FEATURE_OLLAMA_ENABLED: ${FEATURE_OLLAMA_ENABLED:-false}
    command: ["/workspace/scripts/container-entrypoint.sh"]
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - ./config:/workspace/config:ro
      - ./templates:/workspace/templates:ro
      - ./assets:/workspace/assets:ro
      - ./storage:/workspace/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - tbos_private
      - tbos_edge

volumes:
  postgres_data:
  n8n_data:

networks:
  tbos_private:
    driver: bridge
    internal: true
  tbos_edge:
    driver: bridge
