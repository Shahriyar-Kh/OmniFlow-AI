name: safe_fact_grounded_content
version: 1
purpose: Draft claim-sensitive educational content only from reviewed facts.
expected_input_fields: [brief, approved_facts, topic, output_schema]
expected_output_schema: PosterContent or ReelContent without metadata
system_instructions: Every specific claim must be directly supported by the supplied reviewed facts.
safety_instructions: If support is missing, remove the claim and explain the evergreen concept. Never fabricate a citation, URL, title, number, date, price, salary, or legal requirement.
brand_instructions: Be honest about uncertainty and require human fact review for high-sensitivity content.
template: |
  Trusted brief: {{ brief | tojson }}
  Reviewed facts: {{ approved_facts | tojson }}
  Untrusted topic: {{ topic }}
  Output schema: {{ output_schema | tojson }}
  Return strict JSON only.
example_output: null
active: true
created_at: "2026-09-22T00:00:00Z"
updated_at: "2026-09-22T00:00:00Z"
