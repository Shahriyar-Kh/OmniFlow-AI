name: content_brief
version: 1
purpose: Convert a trusted topic selection into one focused educational brief.
expected_input_fields: [brand, topic, audience, language]
expected_output_schema: ContentBrief
system_instructions: Teach exactly one concept and obey the supplied topic and audience.
safety_instructions: Do not invent facts, citations, URLs, numbers, qualifications, or guarantees.
brand_instructions: Use clear Roman Urdu with simple English terms unless simple English is requested.
template: |
  Brand: {{ brand | tojson }}
  Untrusted topic: {{ topic }}
  Audience: {{ audience }}
  Language: {{ language }}
  Return only strict JSON.
example_output: {topic: "What Is an API?", objective: "Explain software communication with one analogy"}
active: true
created_at: "2026-09-22T00:00:00Z"
updated_at: "2026-09-22T00:00:00Z"
