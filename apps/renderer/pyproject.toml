[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tbos-renderer"
version = "0.2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.16.5",
  "edge-tts==7.2.8",
  "fastapi==0.116.1",
  "google-genai==1.3.0",
  "httpx==0.28.1",
  "Jinja2==3.1.6",
  "Pillow==12.3.0",
  "psycopg[binary]==3.2.10",
  "pydantic-settings==2.10.1",
  "PyYAML==6.0.2",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[tool.setuptools.packages.find]
where = ["src"]
